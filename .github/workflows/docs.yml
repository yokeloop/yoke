# Builds the docs site and deploys to GitHub Pages via Pages-from-Actions.
#
# One-time setup (on a fresh repo): enable Pages with the workflow source.
# The default GITHUB_TOKEN cannot create the Pages site itself, so do it once
# with a personal token that has `repo` scope:
#
#   gh api --method POST repos/<owner>/<repo>/pages -f build_type=workflow
#
# (Equivalent UI path: Settings → Pages → Source = GitHub Actions.)
#
# Supersedes ADR 0001's branch-based deploy decision — see ADR 0001 Amendment.
#
# The workflow only runs on pushes that touch the site, the skill sources,
# or the per-skill long-form docs. Editing unrelated files in main does not
# trigger a rebuild.

name: docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'skills/**'
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Bursts of pushes to main supersede each other — only the latest commit
    # produces an artifact. Keeps queued runner time bounded.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm --filter site build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages itself serialises by environment; never cancel an in-flight deploy.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
