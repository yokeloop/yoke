# Builds the docs site and deploys to GitHub Pages via Pages-from-Actions.
#
# One-time setup: Settings → Pages → Source = GitHub Actions.
# Supersedes ADR 0001's branch-based deploy decision — see PR notes.
#
# The workflow only runs on pushes that touch the site, the skill sources,
# or the per-skill long-form docs. Editing unrelated files in main does not
# trigger a rebuild.

name: docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'skills/**'
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm --filter site build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
