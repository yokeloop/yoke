# Builds the docs site and deploys to GitHub Pages via Pages-from-Actions.
#
# `actions/configure-pages` runs with `enablement: true` so the first workflow
# run also enables Pages on the repository (uses the `pages: write` permission
# granted to the GITHUB_TOKEN below) — no manual Settings → Pages step required.
# Supersedes ADR 0001's branch-based deploy decision — see ADR 0001 Amendment.
#
# The workflow only runs on pushes that touch the site, the skill sources,
# or the per-skill long-form docs. Editing unrelated files in main does not
# trigger a rebuild.

name: docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'skills/**'
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Bursts of pushes to main supersede each other — only the latest commit
    # produces an artifact. Keeps queued runner time bounded.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm --filter site build

      - uses: actions/configure-pages@v5
        with:
          # Auto-create the Pages site on first run; no manual repo setting needed.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages itself serialises by environment; never cancel an in-flight deploy.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
